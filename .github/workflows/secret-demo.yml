name: GitHub Secrets Demo

on:
  push:
    branches:
      - main

jobs:
  secret-test:
    runs-on: ubuntu-latest

    steps:
      - name: Use Secret Safely
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "GitHub Actions workflow started."

          if [ -n "$API_KEY" ]; then
            echo "API key loaded successfully."
            echo "Secret value is protected and not displayed."
          else
            echo "API key was not loaded."
            exit 1
          fi
